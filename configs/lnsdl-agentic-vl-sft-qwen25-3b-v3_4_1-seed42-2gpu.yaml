# ⚑ 队列序 18（plan.md A0m② 2026-09-04 用户裁决：3B 全线 SFT+RL 升为必做）——
#   Qwen2.5-VL-3B 的 **v3.4.1-VIKI 行**（最终契约 {detect, schedule}），seed 42。
#
# 派生规则（A0m②）：由 configs/lnsdl-agentic-vl-sft-qwen25-7b-v3_4_1-seed42-4gpu.yaml
# 逐字节复制，只改 model.path / output_dir / run_name / batch-accum：
#   - lr 5.0e-6、goal=3.0/plan=1.0、cosine/warmup 0.1、freeze 三项、max_seq_len 8192、
#     adafactor、internal_val_seed 4242 —— **与 7B 主行一字不差**（容量轴只动模型规模）。
#   - ⚠ 与旧 3B v3.3 行（lr 1.0e-5、单卡 accum2 = 有效 batch 2）**不是同一配方**：那是
#     P10.S2 容量网格的 2B 档口径；本行的锚点是 7B v3.4.1 主行（先例 = 序 5 G9 8B 的裁决：
#     有效 batch 8 / lr 5e-6 对齐 7B 档）。v3.3 3B 桶与本桶不并列。
#   - 🔴 loss 权重不动（A0m②：两规模统一是定论，不得借"3B 反向"之名单调）。
#
# world size 2（B 机 GPU 两两并行：LOCUS 行占另两张）：2 ranks x bs1 x accum 4 == 有效 batch 8，
# 与 7B 的 4 x 1 x 2 同一优化（同 7B LOCUS config 头注的论证）。3B 参数 ~6 GB bf16，
# fp32 logits 尾部尖峰（seq x 152,064 x 4 B ≈ 2.6 GiB）在 2 ranks 下余量充足。
#
# 训练机 = B（NSDL3：torch 2.8 / tf 4.57.6），与 M 主行（NSDL：torch 2.6 / tf 4.51.3）**跨栈**
# —— 与教师消融两臂同披露口径（plan.md 09-04 20:00 块）：只与 7B 主行并列不相减、报方向。
# eval 口径（A0m②）：护栏开 + rounds3 + temp0 + 4096 + 默认检测器；**A1 硬化不开**（7B 专属）。

model:
  path: checkpoints/base/Qwen2.5-VL-3B-Instruct
  flash_attn: true
  freeze_vision_tower: true
  freeze_multi_modal_projector: true
  freeze_language_model: false

data:
  dir: data/lnsdl/sft/v3_4_1/gpt56_terra_image_p513_obsbranch_v341_full
  prompt_variant: lnsdl_agentic_lean
  max_seq_len: 8192
  internal_val_ratio: 0.05
  internal_val_stratify: ["task_name"]
  internal_val_seed: 4242

training:
  output_dir: checkpoints/lnsdl/sft/v3_4_1/qwen25-vl-3b-gpt56-terra-image-p513-obsbranch-v341-seed42
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  # 2 ranks x 1 x accum 4 == effective batch 8 (7B v3.4.1 parity: 4 x 1 x 2).
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  goal_loss_weight: 3.0
  plan_loss_weight: 1.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.0
  gradient_checkpointing: false
  logging_steps: 10
  save_strategy: steps
  save_steps: 500
  eval_strategy: steps
  eval_steps: 500
  metric_for_best_model: eval_loss
  greater_is_better: false
  load_best_model_at_end: false
  early_stopping_patience: 2
  save_total_limit: 3
  save_only_model: true
  dataloader_num_workers: 0
  report_to: none
  run_name: lnsdl-agentic-vl-sft-3b-gpt56-terra-image-p513-obsbranch-v3.4.1-seed42-2gpu
  optim: adafactor
  seed: 42
  fsdp: ["full_shard", "auto_wrap"]
  fsdp_config:
    transformer_layer_cls_to_wrap: Qwen2_5_VLDecoderLayer
    activation_checkpointing: true
    use_orig_params: true
  ddp_find_unused_parameters: false
  torch_empty_cache_steps: 50
